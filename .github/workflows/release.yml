name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # The app targets macOS 26 and compiles macOS 27 virtualization APIs.
    runs-on: xcode-27
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      HAS_SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 != '' || secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && (secrets.APPLE_SPECIFIC_PASSWORD != '' || secrets.APPLE_APP_PASSWORD != '') }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify Xcode 27 toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 27

      - name: Install VirGL source-build tools
        run: |
          brew install meson pkg-config
          python3 -m pip install --user PyYAML
          xcodebuild -downloadComponent MetalToolchain

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 || secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD || secrets.P12_PASSWORD }}

      - name: Select signing identity
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        run: |
          identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          test -n "$identity"
          echo "EZVM_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release"

      - name: Report candidate-only build
        if: env.HAS_SIGNING_CERTIFICATE != 'true' || env.HAS_NOTARY_CREDENTIALS != 'true'
        run: |
          echo "Release credentials are incomplete. The archive will be uploaded as a workflow artifact, but no GitHub Release or Homebrew update will be published."

      - name: Notarize release archive
        if: env.HAS_SIGNING_CERTIFICATE == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SPECIFIC_PASSWORD: ${{ secrets.APPLE_SPECIFIC_PASSWORD || secrets.APPLE_APP_PASSWORD }}
        run: |
          version="${RELEASE_VERSION#v}"
          xcrun notarytool submit "$RUNNER_TEMP/release/EZVM-$version.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_SPECIFIC_PASSWORD" \
            --wait

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERTIFICATE == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          assets=(
            "$RUNNER_TEMP/release/EZVM-$version.zip"
            "$RUNNER_TEMP/release/EZVM-$version.zip.sha256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "EZVM $version"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              --title "EZVM $version"
          fi

      - name: Check out Homebrew tap
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERTIFICATE == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true' && env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: everettjf/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew Cask
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERTIFICATE == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true' && env.HAS_TAP_TOKEN == 'true'
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p homebrew-tap/Casks
          ruby scripts/update-cask.rb \
            "$version" \
            "$RUNNER_TEMP/release/EZVM-$version.zip" \
            Casks/ezvm.rb \
            homebrew-tap/Casks/ezvm.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ezvm.rb
          git diff --cached --quiet || git commit -m "Update EZVM to $version"
          git push

      - name: Upload candidate build
        if: github.event_name == 'workflow_dispatch' || env.HAS_SIGNING_CERTIFICATE != 'true' || env.HAS_NOTARY_CREDENTIALS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EZVM-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/release/*
