name: EZVM Omarchy

on:
  push:
    branches:
      - main
      - docs/ezvm-omarchy-plan
    paths:
      - "EZVM/EZVM/Core/VMKit/**"
      - "EZVMOmarchy/**"
      - "GuestAgent/linux/**"
      - "Tests/**"
      - "Tools/OmarchyFactoryTool/**"
      - "Package.swift"
      - "scripts/build-omarchy-factory.sh"
      - "scripts/copy-sparse-raw-to-asif.sh"
      - "scripts/verify-raw-device-bytes.pl"
      - "scripts/test-copy-sparse-raw-to-asif.sh"
      - "scripts/test-omarchy-factory-tool.sh"
      - "scripts/test-omarchy-guest-overlay.sh"
      - "scripts/build-omarchy-guest-overlay.sh"
      - "scripts/test-omarchy-guest-overlay-package.sh"
      - "scripts/build-omarchy-release.sh"
      - "scripts/verify-omarchy-release-app.sh"
      - "scripts/verify-omarchy-release-gui.sh"
      - "scripts/test-omarchy-release-gates.sh"
      - "scripts/verify-omarchy-release-evidence.sh"
      - "scripts/test-omarchy-release-evidence.sh"
      - "scripts/publish-omarchy-release.sh"
      - "scripts/test-omarchy-publish-preflight.sh"
      - "scripts/verify-omarchy-image-source-integration.sh"
      - "scripts/test-omarchy-image-source-integration.sh"
      - ".github/workflows/ezvm-omarchy.yml"
  pull_request:
    paths:
      - "EZVM/EZVM/Core/VMKit/**"
      - "EZVMOmarchy/**"
      - "GuestAgent/linux/**"
      - "Tests/**"
      - "Tools/OmarchyFactoryTool/**"
      - "Package.swift"
      - "scripts/build-omarchy-factory.sh"
      - "scripts/copy-sparse-raw-to-asif.sh"
      - "scripts/verify-raw-device-bytes.pl"
      - "scripts/test-copy-sparse-raw-to-asif.sh"
      - "scripts/test-omarchy-factory-tool.sh"
      - "scripts/test-omarchy-guest-overlay.sh"
      - "scripts/build-omarchy-guest-overlay.sh"
      - "scripts/test-omarchy-guest-overlay-package.sh"
      - "scripts/build-omarchy-release.sh"
      - "scripts/verify-omarchy-release-app.sh"
      - "scripts/verify-omarchy-release-gui.sh"
      - "scripts/test-omarchy-release-gates.sh"
      - "scripts/verify-omarchy-release-evidence.sh"
      - "scripts/test-omarchy-release-evidence.sh"
      - "scripts/publish-omarchy-release.sh"
      - "scripts/test-omarchy-publish-preflight.sh"
      - "scripts/verify-omarchy-image-source-integration.sh"
      - "scripts/test-omarchy-image-source-integration.sh"
      - ".github/workflows/ezvm-omarchy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezvm-omarchy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Test shared core and CLI
        run: |
          # This runner intentionally pairs the macOS 27 SDK with an older
          # runtime, whose beta xctest crashes during EZVMCore test teardown
          # after otherwise successful tests. Compile all shared code here and
          # run the runtime-independent CLI bundle. Full Core/Virtualization
          # tests run on the native macOS 27 acceptance host.
          swift build --build-tests
          swift test --filter EZVMCLIKitTests
      - name: Test factory signing pipeline
        run: scripts/test-omarchy-factory-tool.sh
      - name: Test sparse raw-to-ASIF factory conversion
        run: scripts/test-copy-sparse-raw-to-asif.sh
      - name: Validate Omarchy Guest Overlay
        run: |
          bash scripts/test-omarchy-guest-overlay.sh
          bash scripts/test-omarchy-guest-overlay-package.sh
      - name: Generate independent project
        working-directory: EZVMOmarchy
        # XcodeGen emits a few PBXProject compatibility fields according to the
        # installed Xcode version. The following xcodebuild step validates the
        # generated project without requiring byte-identical output across SDKs.
        run: xcodegen generate
      - name: Build EZVM Omarchy and its tests
        working-directory: EZVMOmarchy
        # The Xcode 27 runner currently hosts macOS 26, which can compile the
        # macOS 27 app and test bundle but cannot execute either target. Runtime
        # coverage is performed on the native macOS 27 acceptance host.
        run: >-
          xcodebuild
          -project EZVMOmarchy.xcodeproj
          -scheme 'EZVM Omarchy'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/ezvm-omarchy-derived"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Build unsigned EZVM Omarchy release candidate
        env:
          # RFC 8032 test-vector public key; CI verifies embedding and format,
          # while production release jobs must supply the real channel key.
          EZVM_OMARCHY_FACTORY_PUBLIC_KEY_BASE64: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
        run: scripts/build-omarchy-release.sh 0.1.0-ci "$RUNNER_TEMP/ezvm-omarchy-release"
      - name: Test EZVM Omarchy release rejection gates
        run: scripts/test-omarchy-release-gates.sh
      - name: Test real-guest evidence binding gates
        run: scripts/test-omarchy-release-evidence.sh
      - name: Test two-phase publish preflight
        run: scripts/test-omarchy-publish-preflight.sh
      - name: Test image-source integration contract
        run: scripts/test-omarchy-image-source-integration.sh

  guest-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: GuestAgent/linux/go.mod
          cache: false
      - name: Test and cross-compile Linux Guest Agent
        working-directory: GuestAgent/linux
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/ezvm-agent" .
          file "$RUNNER_TEMP/ezvm-agent" | grep -q 'ELF 64-bit.*ARM aarch64.*statically linked'
