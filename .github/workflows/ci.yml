name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    # EasyVM targets macOS 26 and adopts APIs introduced in the macOS 27 SDK.
    # The xcode-27 image is the GitHub-hosted macOS 26 preview runner.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 27
      - name: Run core tests
        run: swift test

  build:
    name: Build on macOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 27
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project EasyVM/EasyVM.xcodeproj \
            -scheme EasyVM \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/EasyVMDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
      - name: Validate documentation and workflows
        run: |
          test -s README.md
          test -s docs/index.html
          test -s docs/styles.css
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path); puts "validated #{path}" }'
